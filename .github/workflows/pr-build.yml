# ─── PR Build ────────────────────────────────────────────────
# On a pull request into dev or main, builds what the release ships, without
# publishing any of it, so a broken build shows up before the merge instead
# of after the tag:
#   - the Docker image for both platforms, started once and checked through
#     the health endpoint like the Build Test of the release
#   - the CLI binaries for all five targets, signed like the release and
#     each started once with --version where the runner can execute it
#
# A pull request into dev builds what its changes reach: the image when a file
# it is built from changed, the binaries when a file of the CLI changed. A
# pull request into main, the release about to be tagged, builds both always.
# Nothing waits for an approval. v3.1.0 was tagged with a Windows build that
# failed, because this workflow used to wait for one that nobody gave.
#
# Its own workflow rather than jobs of Validate, since the release calls
# Validate and would list these jobs as skipped.

name: PR Build

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What a pull request into dev touches, like the Changes job of validate.yml. Compares the
  # merge commit with its base, which takes the last two commits only.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.check.outputs.docker }}
      cli: ${{ steps.check.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: check
        env:
          BASE: ${{ github.base_ref }}
          # What the Dockerfile copies and builds, the admin CLI and the stubs of the client
          # included, and this workflow.
          DOCKER: >-
            ^(apps/(server|web|cli)|packages)/|^apps/client/(package\.json$|stubs/)|^workers/instances/package\.json$|^(Dockerfile|\.dockerignore|docker-entrypoint\.sh|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)$|^\.github/workflows/pr-build\.yml$
          # What the binaries are compiled from, the version of Bun included, and this workflow.
          CLI: >-
            ^(apps/client|packages)/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|\.bun-version)$|^\.github/workflows/pr-build\.yml$
        run: |
          if [ "$BASE" != "dev" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "cli=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failing diff fails this job, so a build is never skipped by mistake. Notes for the
          # assistant change no behavior, even inside apps/.
          changed=$(git diff --name-only HEAD^1 HEAD | grep -vE '(^|/)CLAUDE\.md$' || true)
          for kind in docker cli; do
            pattern=$([ "$kind" = docker ] && echo "$DOCKER" || echo "$CLI")
            if printf '%s\n' "$changed" | grep -qE "$pattern"; then
              echo "$kind=true" >> "$GITHUB_OUTPUT"
            else
              echo "Nothing the $kind build covers changed."
              echo "$kind=false" >> "$GITHUB_OUTPUT"
            fi
          done

  docker:
    name: Docker (${{ matrix.suffix }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (${{ matrix.suffix }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: skysend:pr-${{ matrix.suffix }}
          # A pull request reads its own cache from earlier pushes, and writes
          # it under a scope of its own so the release cache stays untouched.
          cache-from: |
            type=gha,scope=build-${{ matrix.suffix }}
            type=gha,scope=pr-build-${{ matrix.suffix }}
          cache-to: type=gha,scope=pr-build-${{ matrix.suffix }},mode=max

      - name: Start container
        run: |
          docker run -d --name smoke \
            -p 3000:3000 \
            -e BASE_URL=http://localhost:3000 \
            "skysend:pr-${{ matrix.suffix }}"

      - name: Wait for healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to start within 60s"
          echo "--- Container logs ---"
          docker logs smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  cli:
    name: CLI (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            binary: skysend-linux-x64
            runnable: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: skysend-linux-arm64
            runnable: true
          # Built on an arm64 macOS runner like the release, which cannot
          # start an x64 binary, so this one is only compiled.
          - target: macos-x64
            runner: macos-latest
            binary: skysend-macos-x64
            runnable: false
          - target: macos-arm64
            runner: macos-latest
            binary: skysend-macos-arm64
            runnable: true
          - target: windows-x64
            runner: windows-latest
            binary: skysend-windows-x64.exe
            runnable: true
    steps:
      - uses: actions/checkout@v7

      # The version of .bun-version, the same as the release. "latest" asked the GitHub API for
      # the tags of Bun, which once answered the Windows build of a release with 403.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @skysend/crypto --filter @skysend/note-format --filter @skysend/transfer build && pnpm --filter @skysend/client build

      - name: Compile binary
        run: pnpm --filter @skysend/client build:${{ matrix.target }}

      # Bun leaves the signature of a macOS binary invalid, and Apple Silicon
      # kills a binary with an invalid signature as soon as it starts. An
      # ad-hoc signature, signed the same way as in the release, is enough for a binary installed by install.sh or
      # skysend update, which download it without a quarantine flag.
      - name: Sign macOS binary
        if: startsWith(matrix.target, 'macos-')
        run: |
          codesign --sign - --force apps/client/dist/skysend-${{ matrix.target }}
          codesign --verify --verbose apps/client/dist/skysend-${{ matrix.target }}

      - name: Start binary
        if: matrix.runnable
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$("apps/client/dist/${{ matrix.binary }}" --version)
          echo "skysend --version: ${actual}"
          if [ "$actual" != "$expected" ]; then
            echo "Expected version ${expected}"
            exit 1
          fi

      # Kept for a few days, so the binary of a pull request can be tried by hand.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: apps/client/dist/${{ matrix.binary }}
          retention-days: 7
